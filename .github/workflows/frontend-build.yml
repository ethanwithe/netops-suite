name: frontend-build
on:
  push:
    branches: [offline-sync-1, ui-mejoras-4, ui-mejoras-5, ui-mejoras-6, ui-mejoras-7, ui-mejoras-8, ui-mejoras-9, ui-mejoras-10, ui-mejoras-11, ui-mejoras-12, ui-mejoras-13, ui-mejoras-14, ui-mejoras-15, ui-mejoras-16, ui-mejoras-17]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build
