name: windows-installer
on:
  push:
    branches: [offline-sync-1]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: "Interfaz (modo escritorio, sin Pyodide)"
        shell: bash
        env: { VITE_DESKTOP: "1" }
        run: cd frontend && npm ci && npm run build

      - name: "Servidor local (PyInstaller)"
        shell: bash
        run: |
          cd backend
          pip install -r requirements.txt pyinstaller
          pyinstaller netops-server.spec --noconfirm
          ls -la dist

      - name: "Prueba del servidor empaquetado"
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "netops-data"
          $env:NETOPS_DATA_DIR = $data
          $out = Join-Path $env:RUNNER_TEMP "server.out"
          $p = Start-Process -FilePath "backend\dist\netops-server\netops-server.exe" -RedirectStandardOutput $out -PassThru -WindowStyle Hidden
          $port = $null
          for ($i = 0; $i -lt 120 -and -not $port; $i++) {
            Start-Sleep -Seconds 1
            if (Test-Path $out) { $m = Select-String -Path $out -Pattern "NETOPS_READY (\d+)" ; if ($m) { $port = $m.Matches[0].Groups[1].Value } }
            if ($p.HasExited) { break }
          }
          if (-not $port) { Get-Content $out -ErrorAction SilentlyContinue; throw "El servidor no arrancó" }
          Write-Host "Servidor en el puerto $port"
          Write-Host "---- server.log ----"; Get-Content (Join-Path $data "server.log")
          $h = Invoke-RestMethod "http://127.0.0.1:$port/api/health"
          if ($h.status -ne "ok") { throw "health falló" }
          $idx = Invoke-WebRequest "http://127.0.0.1:$port/" -UseBasicParsing
          if ($idx.Content -notmatch "<div id=`"root`"") { throw "No sirve la interfaz" }
          $info = Invoke-RestMethod "http://127.0.0.1:$port/api/local/info"
          if (-not $info.desktop -or -not $info.puente_code) { throw "local/info falló" }
          $pu = Invoke-RestMethod "http://127.0.0.1:8766/hola"
          if (-not $pu.puente) { throw "La consola local no está activa" }
          $sa = Invoke-WebRequest "http://127.0.0.1:8765/estado" -UseBasicParsing -SkipHttpErrorCheck
          if ($sa.Content -notmatch "agente") { throw "El saturador local no está activo" }
          Test-Path (Join-Path $data "netops.db") | Write-Host
          Stop-Process -Id $p.Id -Force

      - name: "Token protegido con Windows (DPAPI)"
        shell: bash
        run: |
          cd backend
          NETOPS_LOCAL=1 python -c "from app.services.cloud_sync import protect_secret, unprotect_secret; b=protect_secret('abc123'); assert b.startswith('dpapi:'), b; assert unprotect_secret(b)=='abc123'; print('DPAPI ok')"

      - name: "Instalador (Tauri)"
        shell: bash
        run: |
          mkdir -p frontend/src-tauri/binaries
          cp -r backend/dist/netops-server frontend/src-tauri/binaries/netops-server
          cd frontend
          npm install --no-save @tauri-apps/cli@2
          npx tauri icon public/icon-512.png
          npx tauri build

      - name: "Prueba del instalador (instala, abre la ventana y comprueba que carga la interfaz)"
        shell: pwsh
        run: |
          $setup = Get-ChildItem frontend\src-tauri\target\release\bundle\nsis\*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $dir = Join-Path $env:LOCALAPPDATA "NetOps Suite"
          Get-ChildItem $dir -ErrorAction SilentlyContinue | Format-Table Name, Length
          $exe = Get-ChildItem $dir -Filter *.exe -ErrorAction SilentlyContinue | Where-Object { $_.Name -notmatch "uninstall|netops-server" } | Select-Object -First 1
          if (-not $exe) { throw "No se instaló la aplicación" }
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=9222"
          $t0 = Get-Date
          $app = Start-Process $exe.FullName -PassThru
          $page = $null
          for ($i = 0; $i -lt 150 -and -not $page; $i++) {
            Start-Sleep -Seconds 1
            try { $page = Invoke-RestMethod "http://127.0.0.1:9222/json" | Where-Object { $_.url -like "http://127.0.0.1:*" } | Select-Object -First 1 } catch {}
          }
          Write-Host ("Tardó {0:N1} s en cargar la interfaz" -f ((Get-Date) - $t0).TotalSeconds)
          Write-Host "---- server.log ----"
          Get-Content (Join-Path $env:LOCALAPPDATA "NetOpsSuite\server.log") -ErrorAction SilentlyContinue
          if (-not $page) { Get-Process | Where-Object { $_.Name -match "netops" } | Format-Table Name, Id; throw "La ventana no cargó la interfaz" }
          Write-Host ("Ventana en: " + $page.url + " · título: " + $page.title)
          Get-Process | Where-Object { $_.Name -match "netops" } | Stop-Process -Force

      - uses: actions/upload-artifact@v4
        with:
          name: NetOps-Suite-Windows
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
